name: daily-digest

on:
  schedule:
    # 16:30 UTC = 00:30 Asia/Shanghai
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python -m pipeline.main

      - name: Commit and push
        run: |
          git config user.name "murmur-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily digest $(date -u +%F)"
            git push
          fi
